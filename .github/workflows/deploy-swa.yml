name: Provision Infrastructure & Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  infra:
    name: Provision Azure Infrastructure (Terraform)
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      swa_api_key: ${{ steps.tf_outputs.outputs.swa_api_key }}
      swa_hostname: ${{ steps.tf_outputs.outputs.swa_hostname }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure Credentials for Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.6.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Import Existing Resources If Present
        working-directory: infra/terraform
        run: |
          terraform import azurerm_resource_group.rg /subscriptions/717cfa33-1524-4715-a9e2-effb12af994d/resourceGroups/rg-fleetfuels-prod || true
          terraform import 'module.avm_res_web_staticsite.azurerm_static_web_app.this' /subscriptions/717cfa33-1524-4715-a9e2-effb12af994d/resourceGroups/rg-fleetfuels-prod/providers/Microsoft.Web/staticSites/swa-fleetfuels-prod || true

      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve

      - name: Extract Terraform Outputs
        id: tf_outputs
        working-directory: infra/terraform
        run: |
          API_KEY=$(terraform output -raw static_web_app_api_key)
          echo "::add-mask::$API_KEY"
          echo "swa_api_key=$API_KEY" >> "$GITHUB_OUTPUT"

          HOSTNAME=$(terraform output -raw static_web_app_default_hostname)
          echo "swa_hostname=$HOSTNAME" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: infra
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    name: Build & Deploy (Production)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Retrieve SWA Deployment Token
        id: get_token
        uses: azure/cli@v2
        with:
          inlineScript: |
            TOKEN=$(az staticwebapp secrets list --name "swa-fleetfuels-prod" --resource-group "rg-fleetfuels-prod" --query "properties.apiKey" -o tsv)
            echo "::add-mask::$TOKEN"
            echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
