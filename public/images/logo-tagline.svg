<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dropletGradTag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5bb834" />
      <stop offset="60%" stop-color="#469B26" />
      <stop offset="100%" stop-color="#2c6319" />
    </linearGradient>
    <linearGradient id="dropletHighlightTag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadowTag" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#469B26" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Droplet Mark -->
  <g transform="translate(15, 18)" filter="url(#shadowTag)">
    <path d="M48 4 C48 4 12 48 12 70 C12 90 28 104 48 104 C68 104 84 90 84 70 C84 48 48 4 48 4 Z" fill="url(#dropletGradTag)" />
    <path d="M48 16 C48 16 22 52 22 70 C22 84 34 94 48 94 C44 80 46 54 62 42 C54 30 48 16 48 16 Z" fill="url(#dropletHighlightTag)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 72)">
    <text font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="48" letter-spacing="-1.5">
      <tspan fill="#2D3136">FLEET </tspan>
      <tspan fill="#469B26">FUELS</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(127, 102)">
    <text font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="16" fill="#4B5563" letter-spacing="0.2" font-style="italic">
      Fuelling your fleet, powering your business
    </text>
  </g>
</svg>